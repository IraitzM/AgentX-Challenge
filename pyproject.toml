[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finben"
version = "0.1.0"
description = "Finance Agentic benchmark implementing a Green-Purple agent approach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.5",
    "asyncclick>=8.3.0.7",
    "google-adk>=1.14.1",
    "google-genai>=1.36.0",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
]

[project.scripts]
finben = "finben.launcher:cli"

[tool.uv]
package = true
dev-dependencies = [
    "mypy>=1.18.1",
    "ruff>=0.14.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finben"]
